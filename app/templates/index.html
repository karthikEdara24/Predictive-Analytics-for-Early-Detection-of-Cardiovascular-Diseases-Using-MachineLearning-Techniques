<!DOCTYPE html>
<html>
<head>
  <title>Cardiovascular Disease Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: auto;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="submit"] {
      margin-top: 20px;
      background-color: #28a745;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Heart Disease Prediction</h2>
  <form method="POST" action="/predict">
    <label>Age:</label><input type="text" name="Age">
    <label>Resting Blood Pressure:</label><input type="text" name="RestingBP">
    <label>Cholesterol:</label><input type="text" name="Cholesterol">
    <label>Fasting Blood Sugar:</label><input type="text" name="FastingBS">
    <label>Max Heart Rate:</label><input type="text" name="MaxHR">
    <label>Oldpeak:</label><input type="text" name="Oldpeak">
    <label>Sex:</label>
    <select name="Sex">
      <option value="1">Male</option>
      <option value="0">Female</option>
    </select>
    <label>Chest Pain Type:</label>
    <select name="ChestPainType">
      <option value="3">ASY</option>
      <option value="2">ATA</option>
      <option value="1">NAP</option>
      <option value="0">TA</option>
    </select>
    <label>Resting ECG:</label>
    <select name="RestingECG">
      <option value="2">LVH</option>
      <option value="1">Normal</option>
      <option value="0">ST</option>
    </select>
    <label>Exercise Induced Angina:</label>
    <select name="ExerciseAngina">
      <option value="1">Yes</option>
      <option value="0">No</option>
    </select>
    <label>ST Slope:</label>
    <select name="ST_Slope">
      <option value="2">Down</option>
      <option value="1">Flat</option>
      <option value="0">Up</option>
    </select>
    <input type="submit" value="Predict">
  </form>
</body>

</html>
